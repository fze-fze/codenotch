name: Codenotch
options:
  bundleIdPrefix: com.vinz
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Sparkle compares CFBundleVersion to decide what is newer, and
    # Sources/Info.plist reads both from here — hardcoding them there instead
    # silently pins every build to one version, so no customer ever sees an
    # update. Bump CURRENT_PROJECT_VERSION on every release.
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    # Required by notarization. Worth knowing what it does *not* break here:
    # the keychain read is unaffected (the ACL keys on the signing identity,
    # which is unchanged), and reading Cursor's and Codex's SQLite files is
    # ordinary file access. It is the App Sandbox that would break both, which
    # is why that stays off — Developer ID distribution does not require it.
    ENABLE_HARDENED_RUNTIME: "YES"
    ENABLE_APP_SANDBOX: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
  # Signed with a stable identity on purpose, in both configurations. The app
  # reads Claude Code's and Antigravity's OAuth tokens out of the login
  # keychain, and the keychain's ACL remembers *which signed binary* was
  # allowed — it stores the binary's designated requirement. Ad-hoc signing
  # produces `designated => cdhash H"..."`, which changes on every rebuild, so
  # "Always Allow" is forgotten each time and the prompt comes back after every
  # `make run`. A certificate produces `designated => identifier
  # "com.vinz.codenotch" and ... certificate leaf[subject.CN] = "..."`, which
  # does not, so the grant is given once.
  #
  # Which certificate differs by configuration, because the two builds are for
  # different audiences:
  configs:
    # Local builds, for whoever is sitting in front of this machine. Any
    # ordinary Apple Development certificate will do — it is stable across
    # rebuilds, which is the only property the keychain cares about. Automatic
    # signing picks it from the team below; change DEVELOPMENT_TEAM to your own
    # (`security find-identity -v -p codesigning` names it) and `make run`
    # works with no other edit. Nothing here is distributable, and it does not
    # need to be.
    Debug:
      CODE_SIGN_IDENTITY: "Apple Development"
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 748F55CAHW
    # Shipping builds, for everyone else. Developer ID is what Gatekeeper on a
    # stranger's Mac will accept and what notarization requires, so `make
    # release` needs the project's own identity and cannot borrow a local one.
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      CODE_SIGN_STYLE: Manual
      DEVELOPMENT_TEAM: 6WFPL8B9FB

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  Codenotch:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: Sparkle
    info:
      path: Sources/Info.plist
      properties:
        # Deliberately a normal Dock app, not an `LSUIElement` agent. The
        # notch is ambient, but the *app* still has to be findable: without a
        # Dock tile there is nothing to click to open it, nothing in Cmd-Tab,
        # and no obvious way to reach settings or quit.
        CFBundleName: Codenotch
        CFBundleDisplayName: Codenotch
        LSMinimumSystemVersion: "26.0"
        # Sources/Info.plist is *generated* from this block, so editing that
        # file directly is undone by the next `make gen`. Pointing both at the
        # build settings keeps one place to bump.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # --- Sparkle -------------------------------------------------------
        # Beside the download itself, on hivinz.com. It used to point at a
        # GitHub Pages URL for a repo that was never created, so every check
        # got a 404 and Sparkle reported "an error occurred in retrieving
        # update information" — correctly, since there was nothing there.
        #
        # Must stay reachable for as long as any copy is installed: the feed is
        # the only route by which a shipped build can ever be replaced.
        SUFeedURL: https://hivinz.com/appcast.xml
        # The public half of the EdDSA key in the login keychain. Sparkle
        # refuses any update not signed by its private half, so a hijacked feed
        # or a swapped download cannot install code. Losing the private key
        # means no existing install can ever be updated again — back it up.
        SUPublicEDKey: rmUfT5r49nR+3HdkbR5/YYLghfnAi6L49eOk3sIegSk=
        # Off, on purpose, in this fork. A local build is signed with a local
        # certificate; the feed above serves a release signed with the
        # project's own. Left on, this copy would eventually meet an update it
        # either could not verify or could only install by replacing itself
        # with someone else's build — neither of which is what a build you
        # compiled yourself is for.
        #
        # "Check now" in Settings still works, so nothing is hidden; nothing
        # is fetched unless it is asked for. Set both back to true to restore
        # the shipping behaviour.
        SUEnableAutomaticChecks: false
        SUAutomaticallyUpdate: false
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vinz.codenotch
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  CodenotchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Codenotch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vinz.codenotch.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Codenotch:
    build:
      targets:
        Codenotch: all
        CodenotchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CodenotchTests
